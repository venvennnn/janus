services:
  - type: web
    name: janus
    runtime: python
    plan: free
    buildCommand: pip install -e ".[serve]"
    startCommand: uvicorn janus.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JANUS_SERVE_DOCS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
