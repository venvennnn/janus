[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-credit"
version = "0.3.0"
description = "JANUS — autonomous red-team agent for credit model integrity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JANUS" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
models = ["xgboost>=2.0", "lightgbm>=4.0"]

[project.scripts]
janus-audit = "janus.run_audit:main"

[tool.setuptools.packages.find]
include = ["janus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
