# Optional Actions deploy. This cannot *create* a Pages site — GitHub's
# GITHUB_TOKEN is not allowed to. Enable Pages once, then run this workflow.
#
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Until that click exists, use Deploy from a branch → /docs instead.
# This file is workflow_dispatch only so a missing Pages site does not
# fail every push.

name: Deploy demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
